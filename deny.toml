# cargo deny check: CI fails on a dependency with a security advisory
# (RustSec), a license not listed here, or a source other than crates.io.
# What hc includes is printed by `hc --licenses`.

[graph]
all-features = true

[advisories]
# Unmaintained crates warn; known vulnerabilities fail.
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # Mozilla's root certificates (webpki-roots, with iroh)
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list covers what the machines-over-iroh work brings too.
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true # our own crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
